<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tab Playground</title>
<style>
  :root {
    --bg: #f5f5f7; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e8;
    --them: #e9e9eb; --tab: #0a84ff; --tab-text: #fff; --chip: #f0f0f3;
    --act: #1a7f37; --clarify: #b26b00; --ignore: #8a8a8e; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --panel: #1c1c1e; --text: #f2f2f7; --muted: #98989f; --line: #2c2c2e;
      --them: #2c2c2e; --tab: #0a84ff; --chip: #2a2a2d; --act: #3fb950; --clarify: #e3a008; --ignore: #8e8e93; --err: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  button, select, input[type=text] { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--tab); }
  button.primary { background: var(--tab); color: #fff; border-color: var(--tab); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: calc(100vh - 53px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }
  #chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-direction: column; max-width: 75%; }
  .row.them { align-self: flex-start; }
  .row.tab { align-self: flex-end; align-items: flex-end; }
  .who { font-size: 11px; color: var(--muted); margin: 0 10px 2px; }
  .bubble { position: relative; padding: 8px 12px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; background: var(--them); }
  .tab .bubble { background: var(--tab); color: var(--tab-text); }
  .bubble img { max-width: 220px; border-radius: 10px; display: block; }
  .quote { font-size: 11px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 6px; margin: 0 10px 3px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reacts { position: absolute; top: -12px; right: -8px; display: flex; gap: 2px; }
  .tab .reacts { left: -8px; right: auto; }
  .reacts span { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 5px; font-size: 12px; }
  .actions { display: flex; gap: 4px; margin: 3px 6px 0; opacity: .25; transition: opacity .15s; }
  .row:hover .actions { opacity: 1; }
  .actions button { padding: 1px 6px; font-size: 12px; border-radius: 6px; }
  .chip { display: inline-flex; gap: 6px; align-items: center; margin: 3px 8px 0; font-size: 11px; background: var(--chip); border-radius: 6px; padding: 2px 7px; cursor: pointer; color: var(--muted); }
  .chip b { color: var(--text); font-weight: 600; }
  .d-act { color: var(--act) !important; } .d-clarify { color: var(--clarify) !important; } .d-ignore { color: var(--ignore) !important; } .d-error { color: var(--err) !important; }
  .purpose { font-size: 10px; color: var(--muted); margin: 2px 10px 0; text-transform: uppercase; letter-spacing: .04em; }
  pre.events { font-size: 11px; background: var(--chip); padding: 8px; border-radius: 8px; max-width: 520px; overflow: auto; margin: 4px 8px 0; }
  #composer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  #composer .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #text { flex: 1; min-width: 180px; padding: 8px 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--bg); }
  #replying { font-size: 12px; color: var(--muted); }
  .presets button { font-size: 12px; padding: 3px 8px; }
  aside { overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 14px; background: var(--panel); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .card .title { display: flex; justify-content: space-between; font-weight: 600; }
  .status { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 10px; background: var(--chip); color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
  td { padding: 2px 0; border-top: 1px solid var(--line); }
  td.r { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 12px; }
  #log div { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); border-top: 1px solid var(--line); padding: 3px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Tab Playground</h1>
  <span class="meta" id="meta">connecting…</span>
  <span style="flex:1"></span>
  <span class="legend">Triggers: <b class="d-act">act</b> ≥ 0.85 · <b class="d-clarify">clarify</b> 0.50–0.85 · <b class="d-ignore">ignore</b> &lt; 0.50</span>
  <button id="newchat">New chat…</button>
</header>
<main>
  <section id="chat">
    <div id="messages"></div>
    <div id="composer">
      <div class="line presets" id="presets"></div>
      <div class="line">
        <select id="sender"></select>
        <label class="muted"><input type="checkbox" id="dm" /> DM Tab</label>
        <span id="replying"></span>
      </div>
      <div class="line">
        <input type="text" id="text" placeholder="Type as the selected member…" autocomplete="off" />
        <label class="muted" title="Send a photo (the text box is the caption)">📷 <input type="file" id="file" accept="image/*" style="width:90px" /></label>
        <button class="primary" id="send">Send</button>
      </div>
    </div>
  </section>
  <aside>
    <div><h2>Expenses</h2><div id="ledger" class="muted">None yet. Try "got pizza for everyone, $48".</div></div>
    <div><h2>Tab's DMs</h2><div id="dms" class="muted">None yet.</div></div>
    <div><h2>Backend log</h2><div id="log" class="muted"></div></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const EMOJI = { love: "❤️", like: "👍", dislike: "👎", laugh: "😂", emphasize: "‼️", question: "❓" };
const money = (c) => "$" + (c / 100).toFixed(2);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
let S = null, replyTo = null, open = new Set(), stick = true;

const PRESETS = [
  "I'm {name}", "got pizza for everyone, $48", "not even, {other} only had a $3 diet coke", "I wasn't there",
  "Venmo me for the Uber", "23", "what do I owe", "why", "let's settle up", "yes", "lmao", "He owes me 500",
];
function renderPresets() {
  const me = S?.members.find((m) => m.phone === $("sender").value);
  const other = S?.members.find((m) => m.phone !== $("sender").value);
  $("presets").innerHTML = '<span class="muted">Try:</span> ' + PRESETS.map((p) =>
    `<button data-p="${esc(p)}">${esc(p.replace("{name}", me?.name ?? "Alex").replace("{other}", other?.name ?? "Sam"))}</button>`).join("");
}
$("presets").addEventListener("click", (e) => {
  const p = e.target.dataset?.p; if (!p) return;
  const me = S?.members.find((m) => m.phone === $("sender").value);
  const other = S?.members.find((m) => m.phone !== $("sender").value);
  $("text").value = p.replace("{name}", me?.name ?? "Alex").replace("{other}", other?.name ?? "Sam");
  $("text").focus();
});

function decisionOf(item) {
  const ev = item.events?.find((e) => e.event === "classified");
  if (ev?.decision) return ev.decision;
  if (item.status === "error") return "error";
  if (item.confidence == null) return null;
  return item.confidence >= 0.85 ? "act" : item.confidence >= 0.5 ? "clarify" : "ignore";
}

function render() {
  if (!S) return;
  $("meta").textContent = `chat ${S.groupId} · onboarding ${S.onboarding ?? "…"} · ${S.backendLog ? "backend log on" : "no backend log (decisions estimated)"}`;
  const sel = $("sender"), cur = sel.value;
  sel.innerHTML = S.members.map((m) => `<option value="${m.phone}">${esc(m.name)} (${m.phone.slice(-4)})</option>`).join("");
  if (cur && S.members.some((m) => m.phone === cur)) sel.value = cur;

  const byId = Object.fromEntries(S.items.map((i) => [i.id, i]));
  const reactsOn = {};
  for (const i of S.items) if (i.kind === "reaction" && i.reply_to) (reactsOn[i.reply_to] ??= []).push(i);
  const box = $("messages");
  stick = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = S.items.filter((i) => i.kind !== "reaction" && !i.dm).map((i) => {
    const tab = i.from === "tab";
    const q = i.reply_to && byId[i.reply_to] ? `<div class="quote">↪ ${esc(byId[i.reply_to].name)}: ${esc(byId[i.reply_to].text || "[photo]")}</div>` : "";
    const rx = (reactsOn[i.id] ?? []).map((r) => `<span title="${esc(r.name)}">${EMOJI[r.reaction] ?? r.reaction}</span>`).join("");
    const body = i.kind === "image" ? `<img src="${esc(i.image_url)}" alt="photo" />${i.text ? esc(i.text) : ""}` : esc(i.text);
    let extra = "";
    if (!tab) {
      const d = decisionOf(i);
      const chip = i.status === "new" || i.status === "processing" ? `<span class="chip">⏳ ${i.status}…</span>`
        : (() => {
            const ev = i.events?.find((e) => e.event === "classified");
            const intent = ev?.intent ?? i.intent, conf = ev?.confidence ?? i.confidence;
            return `<span class="chip" data-toggle="${esc(i.id)}" title="click for the backend's events"><b>${esc(intent ?? "—")}</b> ${conf != null ? Number(conf).toFixed(2) : ""} <b class="d-${d}">${d ?? ""}</b>${i.textCleared ? " · text cleared after handling" : ""}${i.error ? ` <b class="d-error">${esc(i.error)}</b>` : ""}</span>`;
          })();
      extra = chip + (open.has(i.id) ? `<pre class="events">${esc(JSON.stringify(i.events.length ? i.events : { intent: i.intent, confidence: i.confidence, status: i.status }, null, 2))}</pre>` : "");
    } else {
      extra = `<div class="purpose">${esc(i.purpose)}${i.status !== "sent" ? " · " + esc(i.status) : ""}</div>`;
    }
    const actions = `<div class="actions"><button data-reply="${esc(i.id)}">↩ reply</button>${tab ? ["like", "dislike", "question", "love"].map((r) => `<button data-react="${r}" data-target="${esc(i.id)}">${EMOJI[r]}</button>`).join("") : ""}</div>`;
    return `<div class="row ${tab ? "tab" : "them"}"><div class="who">${esc(i.name)}</div>${q}<div class="bubble">${rx ? `<div class="reacts">${rx}</div>` : ""}${body}</div>${extra}${actions}</div>`;
  }).join("") || '<div class="muted">Starting a chat… Tab should post its intro and ask for names.</div>';
  if (stick) box.scrollTop = box.scrollHeight;

  const dms = S.items.filter((i) => i.dm && i.kind !== "reaction");
  $("dms").innerHTML = dms.length ? dms.map((i) => `<div class="card"><div class="muted">${esc(i.name)}${i.purpose ? " · " + esc(i.purpose) : ""}</div>${esc(i.text)}${i.from !== "tab" && i.intent ? `<div class="muted">${esc(i.intent)} ${i.confidence?.toFixed(2) ?? ""}</div>` : ""}</div>`).join("") : "None yet.";

  $("ledger").innerHTML = S.expenses.length ? S.expenses.map((e) => `<div class="card">
      <div class="title"><span>${esc(e.description)} · ${money(e.total)}</span><span class="status">${esc(e.status)}</span></div>
      <div class="muted">paid by ${esc(e.payer ?? "?")} · ${esc(e.mode)}</div>
      <table>${e.shares.map((s) => `<tr><td>${esc(s.name)}${s.role === "payer" ? " (payer)" : ""}</td><td class="muted">${esc(s.status)}</td><td class="r">${money(s.amount)}</td></tr>`).join("")}</table>
      ${e.items.length ? `<table>${e.items.map((it) => `<tr><td>${it.n}. ${esc(it.description)}</td><td class="muted">${esc(it.claimedBy.join(", ") || "unclaimed")}</td><td class="r">${money(it.amount)}</td></tr>`).join("")}</table>` : ""}
      ${e.transfers.length ? `<div class="muted">${e.transfers.map((t) => `${esc(t.from)} → ${esc(t.to)} ${money(t.amount)} (${esc(t.status)})`).join("<br>")}</div>` : ""}
    </div>`).join("") : 'None yet. Try "got pizza for everyone, $48".';

  $("log").innerHTML = S.log.slice().reverse().map((e) => `<div title="${esc(JSON.stringify(e))}">${esc((e.at ?? "").slice(11, 19))} ${esc(e.event)} ${esc(e.intent ?? "")} ${e.decision ? esc(e.decision) : ""} ${e.error ? esc(e.error) : ""}</div>`).join("") || (S.backendLog ? "No events yet." : "Start the playground with PLAYGROUND_BACKEND_LOG to see backend events.");
  renderPresets();
}

$("messages").addEventListener("click", async (e) => {
  const t = e.target.closest("[data-toggle],[data-reply],[data-react]"); if (!t) return;
  if (t.dataset.toggle) { open.has(t.dataset.toggle) ? open.delete(t.dataset.toggle) : open.add(t.dataset.toggle); render(); }
  if (t.dataset.reply) { replyTo = t.dataset.reply; $("replying").innerHTML = `↪ replying in thread <button id="cancelreply">cancel</button>`; $("text").focus(); }
  if (t.dataset.react) { await post("/react", { phone: $("sender").value, target: t.dataset.target, reaction: t.dataset.react }); poll(); }
});
document.addEventListener("click", (e) => { if (e.target.id === "cancelreply") { replyTo = null; $("replying").textContent = ""; } });

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json(); if (j.error) alert(j.error); return j;
}
async function send() {
  const text = $("text").value.trim(), file = $("file").files[0];
  if (!text && !file) return;
  if (file) {
    const f = new FormData(); f.append("file", file); f.append("phone", $("sender").value); f.append("caption", text);
    await fetch("/image", { method: "POST", body: f }); $("file").value = "";
  } else {
    await post("/send", { phone: $("sender").value, text, reply_to: replyTo, dm: $("dm").checked });
  }
  $("text").value = ""; replyTo = null; $("replying").textContent = ""; poll();
}
$("send").onclick = send;
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
$("newchat").onclick = async () => {
  const names = prompt("Members for the new chat (comma-separated):", "Alex, Sam, Priya");
  if (names == null) return;
  S = await post("/new-chat", { names: names.split(",") }); open.clear(); render();
};
async function poll() { try { S = await (await fetch("/state")).json(); render(); } catch { $("meta").textContent = "playground server not reachable"; } }
poll(); setInterval(poll, 1000);
</script>
</body>
</html>
